services:
  - type: web
    name: powerbi-playbook-generator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && waitress-serve --host=0.0.0.0 --port=$PORT app:app
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
